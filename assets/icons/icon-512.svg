<!-- assets/icons/icon-512.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1b34" />
      <stop offset="100%" stop-color="#0a0910" />
    </linearGradient>
    <linearGradient id="purpleNeon512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d00ff" />
      <stop offset="100%" stop-color="#6200a0" />
    </linearGradient>
    <filter id="glow512">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#iconBg512)" stroke="#9d00ff" stroke-width="8"/>
  <!-- Bike Symbol -->
  <g transform="translate(48, 64) scale(1.3)" filter="url(#glow512)">
    <circle cx="70" cy="140" r="42" stroke="#fff" stroke-width="8" fill="none"/>
    <circle cx="250" cy="140" r="42" stroke="#00f2fe" stroke-width="8" fill="none"/>
    <path d="M70 140 L130 140 L160 90 L230 90 L250 140" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M150 85 Q190 70 215 88 L185 110 Z" fill="url(#purpleNeon512)"/>
    <path d="M250 140 L220 65 L205 60" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Text Wordmark -->
  <text x="256" y="420" fill="#fff" font-family="system-ui, sans-serif" font-size="58" font-weight="900" letter-spacing="6" text-anchor="middle">
    TEXSUS
  </text>
  <text x="256" y="455" fill="#9d00ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3" text-anchor="middle">
    RIDE BEYOND LIMITS
  </text>
</svg>
