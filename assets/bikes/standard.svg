<!-- assets/bikes/standard.svg - Futuristic Standard Commuter Bike -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b833ff" />
      <stop offset="100%" stop-color="#6200a0" />
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9d00ff" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background ground glow -->
  <ellipse cx="160" cy="180" rx="130" ry="12" fill="#9d00ff" opacity="0.25"/>
  <!-- Rear Wheel -->
  <circle cx="70" cy="140" r="42" stroke="#1f1d2e" stroke-width="8" fill="#12101e" />
  <circle cx="70" cy="140" r="34" stroke="#9d00ff" stroke-width="2" stroke-dasharray="8 4" fill="none" />
  <circle cx="70" cy="140" r="14" fill="#6200a0" filter="url(#neonShadow)"/>
  <!-- Front Wheel -->
  <circle cx="250" cy="140" r="42" stroke="#1f1d2e" stroke-width="8" fill="#12101e" />
  <circle cx="250" cy="140" r="34" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 4" fill="none" />
  <circle cx="250" cy="140" r="14" fill="#00b0ff" />
  <!-- Frame Structure -->
  <path d="M70 140 L130 140 L160 90 L230 90 L250 140" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M130 140 L170 120 L220 80" stroke="url(#purpleGlow)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Fuel Tank / Body Panels -->
  <path d="M150 85 Q190 70 215 88 L185 110 Z" fill="url(#purpleGlow)" filter="url(#neonShadow)"/>
  <!-- Seat -->
  <path d="M110 92 Q145 92 165 98 L160 108 L115 102 Z" fill="#2e2a44" stroke="#d680ff" stroke-width="1.5"/>
  <!-- Handlebars & Front Fork -->
  <path d="M250 140 L220 65 L205 60" stroke="#e0e0e0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="205" cy="60" r="5" fill="#00f2fe"/>
  <!-- Headlight beam -->
  <polygon points="225,68 285,55 285,85" fill="#00f2fe" opacity="0.25"/>
  <!-- Exhaust -->
  <path d="M140 145 L90 155" stroke="#9e9e9e" stroke-width="5" stroke-linecap="round"/>
</svg>
