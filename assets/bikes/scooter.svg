<!-- assets/bikes/scooter.svg - Sleek Urban Electric/Petrol Scooter -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#c51162" />
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="180" rx="120" ry="10" fill="#ff4081" opacity="0.25"/>
  <!-- Small 12-inch Scooter Wheels -->
  <circle cx="75" cy="148" r="32" stroke="#1f1d2e" stroke-width="8" fill="#12101e" />
  <circle cx="75" cy="148" r="24" stroke="#ff4081" stroke-width="2.5" fill="none" />
  <circle cx="245" cy="148" r="32" stroke="#1f1d2e" stroke-width="8" fill="#12101e" />
  <circle cx="245" cy="148" r="24" stroke="#ff4081" stroke-width="2.5" fill="none" />
  <!-- Step-Through Floorboard Base -->
  <path d="M95 152 L195 152 L215 110 L160 110" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Rear Body Shell & Underseat Storage -->
  <path d="M60 145 C60 110 95 105 140 105 L150 145 Z" fill="url(#pinkGradient)"/>
  <!-- Front Apron & Cowl -->
  <path d="M190 150 L220 95 L245 95 L225 145 Z" fill="url(#pinkGradient)"/>
  <!-- Long Plush Seat -->
  <path d="M85 100 Q125 96 155 102 L150 110 L85 108 Z" fill="#263238" stroke="#ff80ab" stroke-width="1.5"/>
  <!-- Handlebars with integrated LED console -->
  <path d="M220 95 L215 65 L200 62" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <rect x="205" y="58" width="22" height="12" rx="4" fill="#00e676"/>
</svg>
