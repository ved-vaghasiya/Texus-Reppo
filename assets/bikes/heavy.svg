<!-- assets/bikes/heavy.svg - Heavy Luggage Utility Bike with Carrier -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="180" rx="140" ry="12" fill="#ffb300" opacity="0.25"/>
  <!-- Reinforced Wheels -->
  <circle cx="70" cy="140" r="42" stroke="#212121" stroke-width="10" fill="#12101e" />
  <circle cx="70" cy="140" r="32" stroke="#ffb300" stroke-width="3" fill="none" />
  <circle cx="250" cy="140" r="42" stroke="#212121" stroke-width="10" fill="#12101e" />
  <circle cx="250" cy="140" r="32" stroke="#ffb300" stroke-width="3" fill="none" />
  <!-- Heavy Duty Frame -->
  <path d="M70 140 L130 140 L160 95 L225 90 L250 140" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Heavy Duty Rear Luggage Rack -->
  <path d="M40 85 L110 85 L120 105 L45 105 Z" fill="#212121" stroke="#ffb300" stroke-width="2"/>
  <rect x="50" y="65" width="55" height="22" rx="4" fill="url(#amberGold)" stroke="#fff" stroke-width="1.5"/>
  <line x1="45" y1="95" x2="70" y2="140" stroke="#ffb300" stroke-width="4"/>
  <!-- Tank & Body -->
  <path d="M145 92 Q185 75 210 92 L185 115 Z" fill="url(#amberGold)"/>
  <!-- Tough Saddle -->
  <rect x="110" y="90" width="45" height="15" rx="4" fill="#37474f"/>
  <!-- Upright Handlebars -->
  <path d="M225 90 L215 55 L195 50" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
