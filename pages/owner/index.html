<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TEXSUS — Executive Owner Suite</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/icon-192.svg">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>
  <div id="owner-root" class="app-shell"></div>

  <script type="module">
    import { store } from '../../js/storage/store.js';
    import { settings } from '../../js/utils/settings.js';
    import { i18n } from '../../js/utils/i18n.js';
    import { OwnerView } from '../../js/owner/owner-view.js';

    document.addEventListener('DOMContentLoaded', () => {
      settings.init();
      i18n.translateDOM();
      store.setSession('owner', store.get('owner'));
      const root = document.getElementById('owner-root');
      OwnerView.render(root);
    });
  </script>
</body>
</html>
